<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopEasy | Register</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a href="/index.html" class="brand"><span class="brand-mark" aria-hidden="true"></span>ShopEasy</a>
        <div class="nav-actions">
          <a href="/orders.html" class="nav-pill"><strong>Returns</strong><span>& Orders</span></a>
          <a href="/cart.html" class="nav-pill cart-pill"><strong>Cart</strong><span class="cart-count" id="cart-count">0</span></a>
        </div>
      </div>
    </header>

    <main class="center-wrap">
      <div class="auth-card">
        <h1>Create account</h1>
        <div id="form-alert" class="alert" role="alert"></div>
        <form id="auth-form" data-mode="register">
          <div class="field">
            <label for="register-name">Full name</label>
            <input id="register-name" name="name" type="text" placeholder="Your full name" required />
          </div>
          <div class="field">
            <label for="register-email">Email</label>
            <input id="register-email" name="email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="register-password">Password</label>
            <input id="register-password" name="password" type="password" placeholder="Password (min 6 chars)" minlength="6" maxlength="128" required />
          </div>
          <div class="field">
            <label for="register-role">Account type</label>
            <select id="register-role" name="role">
              <option value="customer">Customer</option>
              <option value="seller">Seller</option>
            </select>
          </div>
          <button class="primary-btn wide-button" type="submit">Create account</button>
        </form>
        <div class="auth-links">
          <span>Already have an account?</span>
          <a href="/login.html">Login</a>
        </div>
      </div>
    </main>

    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
